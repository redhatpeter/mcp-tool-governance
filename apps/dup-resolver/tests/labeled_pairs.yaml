# Labeled pair set for the threshold precision/recall study.
#
# Each entry is two tools (server + name + description + optional required
# params) plus a `label` of either:
#   - duplicate: a human reviewer would say "these are the same operation,
#     pick one". Includes both syntactic (same op, different naming) and
#     semantic (same intent, different name + params) cases.
#   - novel:    distinct operations that should NOT cluster. Includes the
#     hard cases (same domain different entity, same entity different
#     action) so we can see where the threshold breaks down.
#
# All tools are drawn from the two demo specs in apim/openapi/ so the
# fingerprints exactly match what production ingest sees. To add real-world
# pairs, append entries with the same shape — server name is opaque to the
# evaluator (it is not part of the fingerprint text).
#
# Conventions:
# - `notes` is freeform; no code reads it.
# - `category` is one of: syntactic_dup, semantic_dup, cross_server_dup,
#                         same_domain_diff_entity, same_entity_diff_action,
#                         unrelated, generic_name. Used only for breakdown
#                         reporting.

pairs:

  # ---- True duplicates: syntactic (same op, different naming) ----
  - label: duplicate
    category: syntactic_dup
    notes: same op, four different naming conventions
    a: { server: messy-mcp, name: createCustomer,
         description: "Create a customer." }
    b: { server: messy-mcp, name: Create_Customer,
         description: "Create a customer." }

  - label: duplicate
    category: syntactic_dup
