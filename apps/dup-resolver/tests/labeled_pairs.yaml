  # ---- Edge cases: ungrouped/generic names ----
  # These are the deliberately-pathological cases. Generic names lose the
  # domain signal in the fingerprint, so they may misbehave at any threshold
  # — that's the point of including them.
  - label: duplicate
    category: generic_name
    notes: "messy-mcp's `create` actually creates a customer"
    a: { server: messy-mcp, name: create,
