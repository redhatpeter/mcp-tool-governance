# Eval prompts for the MCP Tool Governance PoC.
# ---------------------------------------------------------------------------
# Each prompt is a realistic user/agent task. The eval asks an LLM to pick a
# tool from a server's tools/list and we measure whether the pick is
# semantically correct.
#
# Fields:
#   id                  — short slug
#   prompt              — what the user/agent asks
#   expected_canonical  — the wire-name in governed-mcp that *should* be picked
#                         (governed scoring: picked == expected_canonical)
#   acceptable_messy    — names in messy-mcp that are semantically equivalent
#                         (messy scoring: picked ∈ acceptable_messy)
#                         If empty, no messy tool is correct → baseline expected
#                         to fail, exposing the governance gap.
#
# Coverage: 5 governed GET ops × 4 prompts = 20.
# Diversity: paraphrases, indirect phrasing, missing-arg cases (model should
# still pick the right tool and prompt for the missing arg).
# ---------------------------------------------------------------------------

prompts:

  # ---- financeCustomerGet (GET /governed/customers/{id}) ----
  - id: cust-get-01
    prompt: "Look up customer c-001 and tell me their email."
    expected_canonical: financeCustomerGet
    acceptable_messy: [customerLookup, customerFind]

  - id: cust-get-02
    prompt: "What tier is customer c-007?"
    expected_canonical: financeCustomerGet
    acceptable_messy: [customerLookup, customerFind]

  - id: cust-get-03
    prompt: "Pull the customer record for ID c-014."
    expected_canonical: financeCustomerGet
    acceptable_messy: [customerLookup, customerFind]

  - id: cust-get-04
    prompt: "Show me the details for customer c-002."
    expected_canonical: financeCustomerGet
    acceptable_messy: [customerLookup, customerFind]

  # ---- financeCustomerSearch (GET /governed/customers?q=) ----
  - id: cust-search-01
    prompt: "Find every customer whose name contains 'Acme'."
    expected_canonical: financeCustomerSearch
    acceptable_messy: [customerSearch, customerFind, customerLookup]

  - id: cust-search-02
    prompt: "I need to see all customers in the gold tier."
    expected_canonical: financeCustomerSearch
    acceptable_messy: [customerSearch, customerFind, customerLookup]

  - id: cust-search-03
    prompt: "Search for customers with 'corp' in their name."
    expected_canonical: financeCustomerSearch
    acceptable_messy: [customerSearch, customerFind, customerLookup]

  - id: cust-search-04
    prompt: "Which customers have an @example.com email?"
    expected_canonical: financeCustomerSearch
    acceptable_messy: [customerSearch, customerFind, customerLookup]

  # ---- financeInvoiceGet (GET /governed/invoices/{id}) ----
  - id: inv-get-01
    prompt: "Fetch invoice INV-1001 — I need the line items."
    expected_canonical: financeInvoiceGet
    acceptable_messy: [lookup]

  - id: inv-get-02
    prompt: "What's the status of invoice INV-2042?"
    expected_canonical: financeInvoiceGet
    acceptable_messy: [lookup]

  - id: inv-get-03
    prompt: "Pull up invoice number INV-9988 for me."
    expected_canonical: financeInvoiceGet
    acceptable_messy: [lookup]

  - id: inv-get-04
    prompt: "I need the details on invoice INV-3331."
    expected_canonical: financeInvoiceGet
    acceptable_messy: [lookup]

  # ---- financeInvoiceList (GET /governed/invoices?customer_id=&status=) ----
  - id: inv-list-01
    prompt: "List all invoices for customer c-001."
    expected_canonical: financeInvoiceList
    acceptable_messy: [list]

  - id: inv-list-02
    prompt: "Show me every unpaid invoice."
    expected_canonical: financeInvoiceList
    acceptable_messy: [list]

  - id: inv-list-03
    prompt: "What invoices does Acme Corp have outstanding?"
    expected_canonical: financeInvoiceList
    acceptable_messy: [list]

  - id: inv-list-04
    prompt: "Give me a list of all paid invoices from this quarter."
    expected_canonical: financeInvoiceList
    acceptable_messy: [list]

  # ---- financeQuoteGet (GET /governed/quotes/{symbol}) ----
  - id: quote-get-01
    prompt: "What's the current price of MSFT?"
    expected_canonical: financeQuoteGet
    acceptable_messy: []   # messy-mcp has no quote tool — baseline should fail

  - id: quote-get-02
    prompt: "Get me a quote for NVDA."
    expected_canonical: financeQuoteGet
    acceptable_messy: []

  - id: quote-get-03
    prompt: "How much is one share of AAPL trading at?"
    expected_canonical: financeQuoteGet
    acceptable_messy: []

  - id: quote-get-04
    prompt: "Give me the latest stock quote for AMZN."
    expected_canonical: financeQuoteGet
    acceptable_messy: []
